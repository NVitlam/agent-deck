# Agent Deck release: PACKAGE ONLY.
#
# THERE IS DELIBERATELY NO PUBLISH STEP, AND THE REASON CHANGED ON 2026-08-30.
#
# It used to be a capability statement: no Azure DevOps account, no 'nvitlam'
# publisher and no PAT, so 'vsce publish' could not run. All three of those now
# exist - the publisher is live, two releases have shipped under it, and the user
# holds a PAT. Read literally, the old comment told the next reader to add the
# step, and adding it would break a rule rather than complete a plan.
#
# The reason now is a DECISION, and it does not expire: publishing to the
# Marketplace is reserved to the user, always and without exception (reserved
# decision 2). Claude Code prepares the artifact and measures the preconditions;
# a human runs the publish, from a fresh shell, with the PAT in a session-only
# environment variable that is removed afterwards. A publish that any push can
# trigger is a publish nobody decided to make.
#
# src/release/workflow.test.ts fails if 'vsce publish' or a marketplace/PAT
# secret ever appears on an executed line in any workflow, and separately
# requires those strings to be present HERE, in comments, so the shape of the
# thing being refused stays legible:
#
#   - name: Publish to the Marketplace
#     run: npx vsce publish --packagePath dist/agent-deck.vsix
#     env:
#       VSCE_PAT: ${{ secrets.VSCE_PAT }}
#
# That block is what the step would look like. It is written out rather than
# described so that if the decision is ever reversed, the reversal is an edit to
# a workflow and a deleted assertion in src/release/workflow.test.ts - both
# deliberate acts by someone who meant it - and not a guess. Reversing it is the
# user's call and nobody else's.
#
# WHAT THIS FILE CANNOT TELL YOU: this workflow has never been observed running.
# It fires on a v* tag, and no v* tag has been pushed since it was written - the
# last release tag, v0.1.2, predates it. So unlike ci.yml, which has run 49 times
# and failed 37, this one has no history at all. The first time it runs will be
# the release it is for.
#
# Windows-only for the same reason as ci.yml - see the header comment there.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  # Needed by 'gh release create' to attach the VSIX to the tag's release.
  # Nothing here needs write access to anything else.
  contents: write

jobs:
  package:
    runs-on: windows-latest

    # The suite's watcher tests mkdtemp under os.tmpdir() and point a real
    # fs.watch at it. On GitHub's Windows runners os.tmpdir() resolves through
    # an 8.3 SHORT NAME (C:\Users\RUNNER~1\AppData\Local\Temp), and libuv
    # asserts that the filename it reports starts with the directory it was
    # given -- long name vs short name -- so the whole Node process ABORTS:
    #
    #   Assertion failed: !_wcsnicmp(filename, dir, dirlen),
    #   file src\win\fs-event.c, line 72
    #
    # It is not a test failure and there is no failing assertion to read: the
    # process dies ~1 s into the run with no summary. Measured on run
    # 32521608054. runner.temp is a long path, so pointing TMP/TEMP at it makes
    # os.tmpdir() return a name libuv can compare.
    #
    # THIS IS A WORKAROUND, NOT THE FIX. The real defect is in the tests --
    # src/watch/watcher.test.ts:47 and src/watch/inference.test.ts:40 should
    # resolve realpathSync.native() before watching, which would make them
    # robust for any Windows developer whose TEMP has a short component too.
    # Those files belong to earlier phases; the defect is recorded in
    # HANDOVER.md rather than fixed from inside a CI change.
    steps:
      # See ci.yml: repo-local setting, must be set before the working tree
      # exists, otherwise checkout fails with 'Filename too long'.
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      # Set here rather than in a job-level `env:` block: the `runner` context
      # is NOT available to `jobs.<id>.env` (only github/needs/strategy/matrix/
      # vars/secrets/inputs are), and using it there makes the whole workflow
      # unparseable - GitHub reports "This run likely failed because of a
      # workflow file issue" with a 0s duration and no log. Measured on run
      # 32521872781.
      - name: Use a long TEMP path
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE GATES ARE REPEATED HERE ON PURPOSE (orchestrator decision at
      # integration, overriding the package author's reasoning, which was that
      # ci.yml already ran them on the push that produced this commit).
      #
      # That reasoning holds only when the tag points at a commit ci.yml
      # actually ran and passed. A tag is a human action and can name any
      # commit in the history — including one pushed before ci.yml existed, one
      # from a branch whose run was cancelled, or one whose run went red. The
      # artifact produced here is the thing a user installs, so it is gated on
      # its own evidence rather than on a run somebody hopes happened.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # Not `npm test`: the npm shim intermittently exits 127 on this project.
        run: npx vitest run

      # 'npm run package' is 'vsce package --no-dependencies --out
      # dist/agent-deck.vsix'. vsce runs the 'vscode:prepublish' script first,
      # and that script is 'node esbuild.config.mjs --production'.
      #
      # THE --production FLAG IS LOAD-BEARING, not tidiness: a default build
      # emits 16 'fakecss:C:/Users/...' comments into the stylesheet, which is
      # how a developer's home directory leaked into a VSIX once already. Do not
      # replace this with 'npm run build' plus a bare vsce invocation.
      - name: Package VSIX
        run: npm run package

      # The gated leg of src/release/vsix.test.ts: build a real .vsix, unzip it,
      # and scan every shipped byte for a developer identifier. It is gated out
      # of the normal suite because 'vsce package' rewrites the shared dist/ via
      # vscode:prepublish and would race the tests that read it. Here nothing
      # else is running, and here is where the artifact is actually produced.
      #
      # If this step is deleted, src/release/vsix.test.ts goes red — it asserts
      # this workflow still names AGENT_DECK_PACKAGE_AUDIT, so the gate cannot
      # quietly become a test nobody runs.
      - name: Audit the packaged artifact's bytes
        env:
          AGENT_DECK_PACKAGE_AUDIT: '1'
        run: npx vitest run src/release/vsix.test.ts

      - name: Upload VSIX as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-deck-vsix
          path: dist/agent-deck.vsix
          if-no-files-found: error

      # gh is preinstalled on GitHub-hosted runners and authenticates with the
      # job's own GITHUB_TOKEN. Used in preference to a third-party release
      # action so this workflow pulls in no code from outside github.com's own
      # namespaces.
      - name: Attach VSIX to the GitHub Release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/agent-deck.vsix --title "$GITHUB_REF_NAME" --generate-notes
